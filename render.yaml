services:
  - type: web
    name: gap-path-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
