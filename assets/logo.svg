<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 40" width="180" height="40" fill="none" role="img" aria-label="GapPath AI Logo">
  <defs>
    <linearGradient id="gpLogoGrad" x1="0" y1="38" x2="38" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="gpAiPillGrad" x1="135" y1="28" x2="165" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
  </defs>
  <!-- Icon Mark (36x36 at x=2, y=2) -->
  <g transform="translate(2, 2)">
    <rect width="36" height="36" rx="9" fill="url(#gpLogoGrad)" />
    <path d="M8 26 C 12 26, 13 18, 18 18 C 23 18, 24 9, 28 9" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="8" cy="26" r="2.8" fill="#FFFFFF" />
    <circle cx="18" cy="18" r="3" fill="#FFFFFF" />
    <circle cx="28" cy="9" r="3.2" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.6" />
  </g>
  <!-- Brand Typography: GapPath -->
  <text x="48" y="27" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0F172A" letter-spacing="-0.5">GapPath</text>
  <!-- AI Pill Badge -->
  <rect x="136" y="11" width="30" height="18" rx="9" fill="url(#gpAiPillGrad)" />
  <text x="151" y="24" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">AI</text>
</svg>
