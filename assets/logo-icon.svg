<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 38" width="38" height="38" fill="none" role="img" aria-label="GapPath AI Icon">
  <defs>
    <linearGradient id="gpIconGrad" x1="0" y1="38" x2="38" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <filter id="gpNodeGlow" x="22" y="3" width="14" height="14" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Rounded Base Card -->
  <rect width="38" height="38" rx="9" fill="url(#gpIconGrad)" />
  <!-- Dynamic Ascending Path bridging the gap -->
  <path d="M9 28 C 13 28, 14 20, 19 20 C 24 20, 25 10, 29 10" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Stepping Milestone Nodes representing learning progress -->
  <circle cx="9" cy="28" r="3" fill="#FFFFFF" />
  <circle cx="19" cy="20" r="3.2" fill="#FFFFFF" />
  <!-- Apex Mastery Node with illuminated core -->
  <circle cx="29" cy="10" r="3.6" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.8" filter="url(#gpNodeGlow)" />
</svg>
